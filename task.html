<h1>Решение алгоритмической задачи</h1>
<h2>Задача 1010</h2>
<p>Дано число X. Определить, принадлежит ли это число заданному промежутку [a, b].</p>
<form onsubmit="checkNumber(); return false;">
    <p><label for="x">X</label><br><input id="x" type="number" step="any" value="5" required></p>
    <p><label for="a">a</label><br><input id="a" type="number" step="any" value="1" required></p>
    <p><label for="b">b</label><br><input id="b" type="number" step="any" value="10" required></p>
    <p><button type="submit">Проверить</button></p>
</form>
<p id="result"></p>
<script>
function checkNumber() {
    var x = Number(document.getElementById("x").value);
    var a = Number(document.getElementById("a").value);
    var b = Number(document.getElementById("b").value);

    if (a > b) {
        document.getElementById("result").innerText = "Левая граница не может быть больше правой.";
    } else if (x >= a && x <= b) {
        document.getElementById("result").innerText = "Число принадлежит промежутку.";
    } else {
        document.getElementById("result").innerText = "Число не принадлежит промежутку.";
    }
}
</script>

<main>
<h1>DOM_JS. Считываем информацию из DOM</h1>
<div class="passport-scroll">
<div class="passport-image">
    <img src="images/passport_template.png" alt="Образец разворота паспорта">
    <span class="field issued">ОТДЕЛОМ МВД РОССИИ</span>
    <span class="field issued-date">01.01.2020</span>
    <span class="field office-code">000-000</span>
    <span class="field surname" id="passport_surname">СИМОНОВА</span>
    <span class="field name" id="passport_name">ДАРЬЯ</span>
    <span class="field patronymic">ИВАНОВНА</span>
    <span class="field sex">ЖЕН.</span>
    <span class="field birthdate"><span id="passport_date">15 АПРЕЛЯ </span><span id="passport_year">2007</span></span>
    <span class="field birthplace">МОСКВА</span>
</div>
</div>
<h2>Данные из DOM</h2>
<p><button type="button" onclick="showPassport()">Получить данные</button></p>
<p id="dom_result"></p>
<p><a href="change.html">Изменение данных по клику</a></p>
<p><a href="images/dom_console.png" target="_blank">Скриншот выполнения</a></p>
<script>
function showPassport() {
    var surname = document.getElementById("passport_surname").innerText;
    var name = document.getElementById("passport_name").innerText;
    var year = document.getElementById("passport_year").innerText;
    document.getElementById("dom_result").innerText = surname + " " + name + " " + year;
    console.log(surname, name, year);
}
</script>
